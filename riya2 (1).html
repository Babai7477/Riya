<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Riya</title>
<style>
  :root { --accent:#ff6f91; --bg:#0b0b10; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:#fff; font-family:system-ui,sans-serif; overflow:hidden; }

  /* ---- face stage ---- */
  #stage { position:fixed; inset:0; background:#000; }
  #stage video, #stage img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:opacity .35s ease; }
  #talk { opacity:0; }
  #stage.speaking #talk { opacity:1; }
  /* photo fallback (when no videos): gentle sway, stronger while speaking */
  #photo { display:none; animation:sway 7s ease-in-out infinite; transform-origin:50% 60%; }
  #stage.photo-mode #photo { display:block; }
  #stage.photo-mode.speaking #photo { animation:talk .5s ease-in-out infinite; }
  @keyframes sway { 0%,100%{transform:scale(1.04) rotate(-.4deg) translateY(0)} 50%{transform:scale(1.07) rotate(.5deg) translateY(-6px)} }
  @keyframes talk { 0%,100%{transform:scale(1.06) translateY(0)} 50%{transform:scale(1.075) translateY(-4px)} }
  #shade { position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(to top, rgba(0,0,0,.75) 0%, rgba(0,0,0,0) 38%), linear-gradient(to bottom, rgba(0,0,0,.5) 0%, rgba(0,0,0,0) 14%); }

  /* ---- ui ---- */
  #top { position:fixed; top:0; left:0; right:0; padding:calc(env(safe-area-inset-top) + 10px) 14px 0; display:flex; justify-content:space-between; align-items:center; z-index:5; }
  #name { font-weight:600; letter-spacing:.5px; text-shadow:0 1px 6px #000; }
  #status { font-size:12px; opacity:.85; margin-left:8px; font-weight:400; }
  .iconbtn { background:rgba(0,0,0,.4); border:0; color:#fff; width:40px; height:40px; border-radius:50%; font-size:18px; }

  #log { position:fixed; top:calc(env(safe-area-inset-top) + 56px); left:14px; right:14px; z-index:5; font:11px/1.35 monospace; color:#9fe; opacity:.85; text-shadow:0 1px 3px #000; pointer-events:none; }
  #caption { position:fixed; left:14px; right:14px; bottom:calc(env(safe-area-inset-bottom) + 86px); z-index:5;
    font-size:17px; line-height:1.4; text-shadow:0 1px 6px #000; max-height:32vh; overflow:auto; }
  #caption .you { opacity:.7; font-size:14px; display:block; margin-bottom:4px; }

  #bar { position:fixed; left:0; right:0; bottom:0; z-index:5; padding:10px 12px calc(env(safe-area-inset-bottom) + 12px); display:flex; gap:8px; align-items:center; }
  #text { flex:1; min-width:0; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.2); color:#fff; border-radius:24px; padding:12px 16px; font-size:16px; outline:none; }
  #mic { width:54px; height:54px; border-radius:50%; border:0; background:var(--accent); color:#fff; font-size:22px; flex:none; }
  #mic.on { animation:pulse 1s infinite; background:#e53958; }
  #send { width:46px; height:46px; border-radius:50%; border:0; background:rgba(255,255,255,.18); color:#fff; font-size:18px; flex:none; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(229,57,88,.7)} 100%{box-shadow:0 0 0 18px rgba(229,57,88,0)} }

  /* ---- overlays ---- */
  .overlay { position:fixed; inset:0; z-index:20; background:rgba(8,8,12,.92); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center; }
  .overlay.hidden { display:none; }
  .overlay h1 { margin:0; font-size:28px; }
  .overlay button.big { background:var(--accent); color:#fff; border:0; border-radius:28px; padding:14px 34px; font-size:18px; }
  .overlay input { width:100%; max-width:380px; background:#1a1a22; border:1px solid #333; color:#fff; border-radius:12px; padding:12px; font-size:15px; }
  .overlay label { font-size:13px; opacity:.7; align-self:flex-start; max-width:380px; width:100%; text-align:left; }
</style>
</head>

<div id="top">
  <div id="name">Riya <span id="status">ready</span></div>
  <button class="iconbtn" id="gear" aria-label="settings">⚙</button>
</div>

<div id="log"></div>
<div id="caption"></div>

<div id="bar">
  <input id="text" placeholder="Riya se baat karo…" autocomplete="off">
  <button id="send" aria-label="send">➤</button>
  <button id="mic" aria-label="mic">🎤</button>
</div>

<!-- start screen (needed so the browser allows video + voice) -->
<div class="overlay" id="start">
  <h1>Riya</h1>
  <button class="big" id="startBtn">Start</button>
</div>

<!-- settings -->
<div class="overlay hidden" id="settings">
  <h1>Settings</h1>
  <label>Gemini API key</label>
  <input id="key" type="password" placeholder="AIza…" autocomplete="off">
  <label>Gemini model</label>
  <input id="model" placeholder="gemini-3.8-flash">
  <label>Riya kaisi baat kare (personality)</label>
  <input id="persona" placeholder="">
  <button class="big" id="save">Save</button>
</div>

<script>
const $ = id => document.getElementById(id);
const logs = [];
function log(m){ logs.push(m); if (logs.length > 5) logs.shift(); const el = $('log'); if (el) el.textContent = logs.join('\n'); }
window.addEventListener('error', e => log('JS error: ' + e.message));
const stage = $('stage'), idle = $('idle'), talk = $('talk');
const store = {
  get(k, d=''){ try { return localStorage.getItem(k) ?? d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};
const DEFAULT_PERSONA = "Tum Riya ho, ek pyaari, samajhdaar female AI assistant (Jarvis jaisi). Hindi mein (Hinglish chalega) baat karo. Jawab chhota rakho: 1-3 chhote vakya, bolne ke layak, bina emoji, bina markdown.";
let history = [];
let videosOK = { idle:true, talk:true };

/* ---------- face: videos, with photo fallback ---------- */
function refreshMode(){
  const noVideo = !videosOK.idle;
  stage.classList.toggle('photo-mode', noVideo);
  idle.style.display = videosOK.idle ? '' : 'none';
  talk.style.display = videosOK.talk ? '' : 'none';
}
idle.addEventListener('error', () => { videosOK.idle = false; refreshMode(); });
talk.addEventListener('error', () => { videosOK.talk = false; refreshMode(); });

function setSpeaking(on){
  stage.classList.toggle('speaking', on);
  if (videosOK.talk && on) { talk.currentTime = 0; talk.play().catch(()=>{}); }
  if (!on) { setTimeout(() => { if (!stage.classList.contains('speaking')) talk.pause(); }, 400); }
}

/* ---------- voice out ---------- */
let voice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /hi[-_]IN/i.test(v.lang) && /female|woman/i.test(v.name))
       || vs.find(v => /hi[-_]IN/i.test(v.lang))
       || vs.find(v => /^hi/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
log('riya2 ready');

function speak(text){
  return new Promise(resolve => {
    if (!('speechSynthesis' in window)) { log('is browser mein awaaz (speechSynthesis) nahi hai'); setSpeaking(true); setTimeout(() => { setSpeaking(false); resolve(); }, Math.min(8000, text.length * 90)); return; }
    log('awaaz: ' + (voice ? voice.name + ' ' + voice.lang : 'default voice'));
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'hi-IN'; if (voice) u.voice = voice;
    u.pitch = 1.15; u.rate = 1.0;
    let done = false;
    const finish = () => { if (done) return; done = true; clearTimeout(guard); setSpeaking(false); setStatus('ready'); resolve(); };
    // Android Chrome sometimes never fires onend – safety timer
    const guard = setTimeout(finish, Math.max(4000, text.length * 120));
    u.onstart = () => { setSpeaking(true); setStatus('bol rahi hai…'); };
    u.onend = finish; u.onerror = e => { log('awaaz error: ' + (e.error || '?')); finish(); };
    speechSynthesis.speak(u);
  });
}

/* ---------- Gemini ---------- */
async function askGemini(userText){
  const key = store.get('key');
  if (!key) { openSettings(); throw new Error('API key daalo'); }
  const model = store.get('model') || 'gemini-3.8-flash';
  history.push({ role:'user', parts:[{ text:userText }] });
  const body = {
    systemInstruction: { parts:[{ text: store.get('persona') || DEFAULT_PERSONA }] },
    contents: history.slice(-20)
  };
  log('Gemini ko bhej rahi hoon (' + model + ')…');
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 25000);
  let r, j;
  try {
    r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`, {
      method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body), signal: ctl.signal
    });
    j = await r.json();
  } catch (e) {
    history.pop();
    throw new Error(e.name === 'AbortError' ? 'Gemini 25 second mein jawab nahi diya (internet check karo)' : 'Internet/Gemini tak nahi pahunch paya: ' + e.message);
  } finally { clearTimeout(timer); }
  log('Gemini jawab: HTTP ' + r.status);
  if (!r.ok) { history.pop(); throw new Error(j.error?.message || ('HTTP ' + r.status)); }
  const reply = (j.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('').trim();
  if (!reply) { history.pop(); throw new Error('khaali jawab'); }
  history.push({ role:'model', parts:[{ text:reply }] });
  return reply;
}

/* ---------- conversation ---------- */
let busy = false, busySince = 0;
async function handle(text){
  text = (text || '').trim();
  if (!text) return;
  if (busy && Date.now() - busySince < 30000) { log('abhi jawab ka intezaar hai…'); return; }
  busy = true; busySince = Date.now();
  $('text').value = '';
  $('caption').innerHTML = `<span class="you">${esc(text)}</span>`;
  setStatus('soch rahi hai…');
  try {
    const reply = await askGemini(text);
    $('caption').innerHTML = `<span class="you">${esc(text)}</span>${esc(reply)}`;
    await speak(reply);
  } catch (e) {
    $('caption').innerHTML = `<span class="you">${esc(text)}</span>⚠ ${esc(e.message)}`;
    setStatus('error');
  } finally { busy = false; }
}
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function setStatus(s){ $('status').textContent = s; }

/* ---------- voice in ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
function toggleMic(){
  if (!SR) { setStatus('mic nahi'); log('is browser mein mic (SpeechRecognition) nahi hai'); return; }
  if (listening) { rec && rec.stop(); return; }
  speechSynthesis.cancel(); setSpeaking(false);
  rec = new SR(); rec.lang = 'hi-IN'; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onstart = () => { listening = true; $('mic').classList.add('on'); setStatus('sun rahi hai…'); };
  rec.onresult = e => { const t = e.results[0][0].transcript; log('suna: ' + t); handle(t); };
  rec.onerror = e => { setStatus('mic error'); log('mic error: ' + e.error); };
  rec.onend = () => { listening = false; $('mic').classList.remove('on'); if (!busy) setStatus('ready'); };
  rec.start();
}

/* ---------- settings ---------- */
function openSettings(){
  $('key').value = store.get('key'); $('model').value = store.get('model');
  $('persona').value = store.get('persona'); $('settings').classList.remove('hidden');
}
$('gear').onclick = openSettings;
$('save').onclick = () => {
  store.set('key', $('key').value.trim()); store.set('model', $('model').value.trim());
  store.set('persona', $('persona').value.trim()); $('settings').classList.add('hidden');
};

/* ---------- wiring ---------- */
$('startBtn').onclick = () => {
  $('start').classList.add('hidden');
  idle.play().catch(()=>{});
  // unlock speech on mobile with a silent utterance
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch(e){}
  if (!store.get('key')) openSettings();
};
$('mic').onclick = toggleMic;
$('send').onclick = () => handle($('text').value);
$('text').addEventListener('keydown', e => { if (e.key === 'Enter') handle($('text').value); });
// if the photo itself is missing too, hide it quietly
$('photo').addEventListener('error', () => { $('photo').style.display = 'none'; });
refreshMode();
</script>
